name: SentinelX CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: |
        cd gateway
        pip install -r requirements.txt
    - name: Lint with flake8
      run: |
        pip install flake8
        flake8 gateway/app --count --select=E9,F63,F7,F82 --show-source --statistics
    - name: Evaluate ML Model
      run: |
        cd gateway
        python -m app.seed.train_baseline
        python -m app.seed.eval_model
